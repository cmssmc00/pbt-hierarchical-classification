name: Code and synthetic checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Check publication boundary
        run: python tools/check_public_tree.py
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests on fictional inputs
        run: python -m unittest discover -s tests -v
      - name: End-to-end synthetic hierarchy
        run: pbt demo --config configs/hard6to10_fixed25.json --output outputs/ci_demo
